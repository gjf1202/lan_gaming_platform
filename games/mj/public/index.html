<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1f22">
  <meta name="description" content="同一局域网的四人麻将牌桌。">
  <title>游戏厅 · 麻将</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232b2d30'/%3E%3Crect x='14' y='10' width='36' height='44' rx='5' fill='%23e5e1d7'/%3E%3Cpath d='M23 42V23l9 12 9-12v19' fill='none' stroke='%231f5b4b' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/games/mj/style.css">
  <link rel="stylesheet" href="/platform.css">
  <script src="/bridge.js" defer></script>
  <script src="/games/mj/app.js" defer></script>
</head>
<body data-platform-game="mj">
  <nav class="platform-bar" aria-label="游戏平台"><a class="platform-home" href="/">▦ <strong>游戏厅</strong> <span>/ 大厅</span></a><div class="platform-games"><a href="/games/ddz/" >斗地主</a><a href="/games/wzq/" >五子棋</a><a href="/games/mj/" aria-current="page">麻将</a></div></nav>
  <header class="app-header">
    <a class="brand" href="/" aria-label="返回大厅"><span class="brand-mark">麻</span><span>麻将</span><span class="brand-divider"></span><span class="brand-subtitle">四人牌桌</span></a>
    <div class="header-meta"><button id="alerts-toggle" class="text-button" type="button" aria-pressed="false" title="出牌及吃碰杠胡提醒已关闭">提醒已关</button><span class="connection"><i id="connection-dot"></i><span id="connection-label">游戏厅</span></span><span class="header-divider"></span><span>136张牌</span></div>
  </header>

  <main id="lobby" class="lobby">
    <section class="lobby-content">
      <div class="eyebrow"><span></span>01 / 找个房间</div>
      <h1>四人围坐，<br>同桌开局。</h1>
      <p class="intro">同一局域网，和好友轻松摸一圈。</p>
      <div class="entry-panel">
        <label for="nickname" class="field-label">你的昵称 <small>最多12个字符</small></label>
        <input id="nickname" maxlength="12" autocomplete="nickname" placeholder="请输入昵称">
        <div class="entry-tabs" role="tablist" aria-label="房间操作">
          <button id="create-tab" class="entry-tab active" role="tab" aria-selected="true" aria-controls="create-panel">创建</button>
          <button id="join-tab" class="entry-tab" role="tab" aria-selected="false" aria-controls="join-panel">加入</button>
        </div>
        <div id="create-panel" role="tabpanel" aria-labelledby="create-tab">
          <p class="field-note">创建牌桌，把房间号发给好友。</p>
          <button id="create-button" class="button primary full" type="button">创建牌桌 <span aria-hidden="true">↗</span></button>
        </div>
        <div id="join-panel" role="tabpanel" aria-labelledby="join-tab" hidden>
          <label class="sr-only" for="room-code">六位房间号</label>
          <input id="room-code" class="code-input" inputmode="numeric" maxlength="6" placeholder="六位房间号" autocomplete="off">
          <button id="join-button" class="button primary full" type="button">加入牌桌 <span aria-hidden="true">↗</span></button>
        </div>
        <div class="entry-footer"><span>4人对战</span><i></i><span>同一网络</span><i></i><span>无需注册</span></div>
      </div>
    </section>
    <section class="lobby-preview" aria-label="麻将牌">
      <div class="preview-heading"><span><i></i>牌桌</span><span>東 · 南 · 西 · 北</span></div>
      <div class="preview-tiles" aria-hidden="true"><b>一<small>萬</small></b><b>五<small>筒</small></b><b>九<small>條</small></b><b class="red-tile">中</b></div>
      <div class="preview-footer"><span>摸牌 · 打牌 · 吃碰杠胡</span><span>四人对战</span></div>
    </section>
  </main>

  <main id="game" class="game" hidden>
    <div class="game-heading">
      <div class="room-heading"><span class="eyebrow">牌桌</span><strong id="room-number"></strong><button id="copy-room" class="text-button" type="button">复制邀请</button></div>
      <div class="table-tools"><span id="wall-label">牌墙 0</span><button id="leave-button" class="text-button danger" type="button">退出</button></div>
    </div>
    <section class="table-panel">
      <div class="seat-row" id="seat-row"></div>
      <div class="table-center">
        <div class="table-center-header"><span id="phase-label">等待中</span><span id="turn-label"></span></div>
        <div id="discard-grid" class="discard-grid" aria-label="已打出的牌"></div>
        <div id="table-message" class="table-message" aria-live="polite"></div>
      </div>
      <section class="hand-section">
        <div class="hand-header"><span>你的手牌 <i id="hand-count"></i></span><span id="self-seat"></span></div>
        <div id="melds" class="meld-row"></div>
        <div id="hand" class="hand-row" aria-label="你的手牌"></div>
        <div id="actions" class="actions"></div>
      </section>
    </section>
    <section class="history-bar"><span>牌局记录</span><div id="table-log" aria-live="polite"></div></section>
  </main>

  <footer class="app-footer"><span>局域网牌桌 · 基础规则</span><span>麻将 <i></i> 四人牌桌</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="leave-dialog" class="modal">
    <h2>退出牌桌？</h2>
    <p>退出后，所有人的本局手牌都会重置。</p>
    <div class="modal-actions"><button id="cancel-leave" class="button secondary" type="button">留下</button><button id="confirm-leave" class="button primary" type="button">退出</button></div>
  </dialog>
</body>
</html>
